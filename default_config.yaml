# YouTube Transcriber Plugin Configuration

# Transcription settings
transcription:
  # Preferred transcript source: "captions" (YouTube auto/manual captions) or "whisper" (local model)
  preferred_source: "captions"
  # Whisper model size: tiny, base, small, medium, large
  whisper_model: "base"
  # Language hint for transcription (empty = auto-detect)
  language: ""

# Visual context extraction
visual:
  # Extract frames when speaker references charts/visuals
  enabled: true
  # Frame extraction interval in seconds (for periodic sampling)
  frame_interval: 30
  # Max frames to extract per video
  max_frames: 20
  # Analyze frames with LLM for visual context
  analyze_frames: true

# Output settings
output:
  # Auto-save transcripts to memory
  save_to_memory: true
  # Export format: "markdown" or "text"
  export_format: "markdown"
  # Include timestamps in transcript
  include_timestamps: true

# Playlist settings
playlist:
  # Max videos to process from a playlist (0 = unlimited)
  max_videos: 10

# Channel transcription settings
channel:
  # Size thresholds — determines batching strategy
  small_threshold: 50       # <= this many videos: transcribe all in one pass
  large_threshold: 200      # > this many videos: use timed batching with long cooldowns

  # Delay between individual video transcriptions (seconds)
  delay_per_video: 3        # small channels
  delay_per_video_medium: 5 # medium channels
  delay_per_video_large: 8  # large channels

  # Batch sizes
  batch_size_small: 0       # 0 = no batching (do them all)
  batch_size_medium: 15     # videos per batch for medium channels
  batch_size_large: 10      # videos per batch for large channels

  # Cooldown between batches (seconds)
  batch_cooldown_medium: 60   # 1 minute between batches
  batch_cooldown_large: 300   # 5 minutes between batches

  # Skip videos without captions (avoids wasting requests on no-caption videos)
  skip_no_captions: true

  # Save visual frames for channel videos (disabled by default — too heavy at scale)
  extract_visuals: false

# Storage
data_dir: "data"
